description = 'Stratum Infrastructure'

configurations {
    otelAgent {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${rootProject.otelJavaAgentVersion}"
    api project(':stratum-domain')
    api project(':stratum-common')
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'com.easy-query:sql-springboot4-starter'
    implementation 'com.easy-query:sql-mysql'
    annotationProcessor 'com.easy-query:sql-processor'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.amqp:spring-rabbit'
    implementation 'org.quartz-scheduler:quartz'
    implementation 'org.springframework:spring-context-support'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template'
    implementation 'net.javacrumbs.shedlock:shedlock-spring'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-crypto'
}

// Agent进程验收显式执行，不改变默认单元测试的运行方式。
tasks.named('test') {
    useJUnitPlatform { excludeTags 'otel-agent' }
}

tasks.register('otelIntegrationTest', Test) {
    description = '以实际Java Agent验证标准上下文桥接与根跨度'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'otel-agent' }
    outputs.upToDateWhen { false }
    systemProperty 'stratum.test.runtime-classpath', sourceSets.test.runtimeClasspath.asPath
    doFirst { systemProperty 'stratum.test.otel-agent', configurations.otelAgent.singleFile.absolutePath }
}
