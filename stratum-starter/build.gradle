plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'integration' }
}

tasks.register('integrationTest', Test) {
    description = '在显式指定的独立 MariaDB/Redis 上执行集成测试'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}

description = 'Stratum Starter'

dependencies {
    implementation project(':stratum-interface')
    implementation project(':stratum-query')
    implementation project(':stratum-application')
    implementation project(':stratum-infrastructure')
    implementation project(':stratum-job')
    implementation project(':stratum-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.validation:jakarta.validation-api'
    testImplementation 'org.springframework.amqp:spring-rabbit'
    testImplementation 'org.quartz-scheduler:quartz'
    testImplementation 'net.javacrumbs.shedlock:shedlock-spring'
    testImplementation 'org.springframework:spring-context-support'
    testImplementation 'org.springframework:spring-jdbc'
    testImplementation 'org.springframework:spring-tx'
    testImplementation 'org.springframework.security:spring-security-core'
    testImplementation 'org.springframework.security:spring-security-web'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'com.easy-query:sql-springboot4-starter'
    testImplementation 'org.springframework.data:spring-data-redis'
    testImplementation 'com.github.ben-manes.caffeine:caffeine'
    annotationProcessor 'com.easy-query:sql-processor'
}

configurations.testAnnotationProcessor.extendsFrom(configurations.annotationProcessor)

def gatewayBootJar = project(':stratum-gateway').tasks.named('bootJar')
tasks.named('integrationTest') {
    dependsOn gatewayBootJar
    systemProperty 'stratum.test.gateway-jar', gatewayBootJar.get().archiveFile.get().asFile.absolutePath
}
