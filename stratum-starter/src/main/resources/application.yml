spring:
  application:
    name: stratum-starter
  profiles:
    active: local

  datasource:
    url: ${STRATUM_DB_URL:jdbc:mariadb://127.0.0.1:13307/stratum}
    username: ${STRATUM_DB_USERNAME:stratum}
    password: ${STRATUM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${STRATUM_REDIS_HOST:127.0.0.1}
      port: ${STRATUM_REDIS_PORT:6379}
      password: ${STRATUM_REDIS_PASSWORD:}
      timeout: 2s

easy-query:
  database: mysql
  name-conversion: underlined

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
