spring:
  application:
    name: stratum-starter
  profiles:
    active: local

  datasource:
    url: ${STRATUM_DB_URL:jdbc:mariadb://127.0.0.1:13307/stratum}
    username: ${STRATUM_DB_USERNAME:stratum}
    password: ${STRATUM_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${STRATUM_REDIS_HOST:127.0.0.1}
      port: ${STRATUM_REDIS_PORT:6379}
      password: ${STRATUM_REDIS_PASSWORD:}
      timeout: 2s

easy-query:
  print-sql: false
  database: mysql
  name-conversion: underlined

stratum:
  messaging:
    enabled: ${STRATUM_MQ_ENABLED:false}
    host: ${STRATUM_MQ_HOST:127.0.0.1}
    port: ${STRATUM_MQ_PORT:5672}
    virtual-host: ${STRATUM_MQ_VHOST:}
    username: ${STRATUM_MQ_USERNAME:}
    password: ${STRATUM_MQ_PASSWORD:}
    timeout: ${STRATUM_MQ_TIMEOUT:2s}
    channels: ${STRATUM_MQ_CHANNELS:16}
    workers: ${STRATUM_MQ_WORKERS:4}
    consumer:
      enabled: ${STRATUM_MQ_CONSUMER_ENABLED:false}
      concurrency: ${STRATUM_MQ_CONSUMER_CONCURRENCY:1}
      prefetch: ${STRATUM_MQ_CONSUMER_PREFETCH:16}
      shutdown-timeout: ${STRATUM_MQ_CONSUMER_SHUTDOWN_TIMEOUT:5s}
  auth:
    jwt:
      enabled: ${STRATUM_AUTH_JWT_ENABLED:false}
      public-key: ${STRATUM_AUTH_PUBLIC_KEY:}
      private-key: ${STRATUM_AUTH_PRIVATE_KEY:}
      issuer: ${STRATUM_AUTH_ISSUER:}
      audience: ${STRATUM_AUTH_AUDIENCE:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  # 嵌套Row等同名DTO使用完整类型标识，避免文档模型相互覆盖。
  use-fqn: true
  api-docs:
    version: OPENAPI_3_0
  packages-to-scan:
    - com.patrick.stratum.interfaceadapter
    - com.patrick.stratum.query
  override-with-generic-response: false
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: Stratum
        url: /v3/api-docs
