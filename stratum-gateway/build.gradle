plugins {
    id 'org.springframework.boot'
}

description = 'Stratum Gateway'

configurations {
    otelAgent {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    otelAgent "io.opentelemetry.javaagent:opentelemetry-javaagent:${rootProject.otelJavaAgentVersion}"
    api project(':stratum-common')
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    systemProperty 'management.health.redis.enabled', 'false'
    useJUnitPlatform { excludeTags 'integration', 'otel-agent' }
}

tasks.register('integrationTest', Test) {
    description = '在显式指定的独立Redis上验证网关共享限流'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'integration' }
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}

// 默认不加载Agent；显式选择时才解析固定版本并注入JVM。
if (providers.gradleProperty('otelAgent').map { it.toBoolean() }.getOrElse(false)) {
    tasks.named('bootRun') {
        doFirst { jvmArgs "-javaagent:${configurations.otelAgent.singleFile.absolutePath}" }
    }
}

tasks.register('otelIntegrationTest', Test) {
    description = '以实际Java Agent和独立Redis验证Gateway标准HTTP追踪'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'otel-agent' }
    outputs.upToDateWhen { false }
    dependsOn tasks.named('bootJar')
    systemProperty 'stratum.test.gateway-jar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    doFirst { systemProperty 'stratum.test.otel-agent', configurations.otelAgent.singleFile.absolutePath }
}
