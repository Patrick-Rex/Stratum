spring:
  application:
    name: stratum-gateway
  data:
    redis:
      host: ${STRATUM_GATEWAY_REDIS_HOST:127.0.0.1}
      port: ${STRATUM_GATEWAY_REDIS_PORT:6379}
      password: ${STRATUM_GATEWAY_REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 1s
  main:
    web-application-type: reactive
  lifecycle:
    timeout-per-shutdown-phase: 10s
  cloud:
    gateway:
      server:
        webflux:
          httpserver:
            customizer-enabled: false
          metrics:
            enabled: false

server:
  address: ${STRATUM_GATEWAY_ADDRESS:127.0.0.1}
  port: ${STRATUM_GATEWAY_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 64KB

management:
  metrics:
    use-global-registry: false
    distribution:
      percentiles-histogram:
        stratum.gateway.requests: true
      slo:
        stratum.gateway.requests: 100ms,300ms,800ms,1s,3s,5s
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

stratum:
  gateway:
    routing:
      enabled: ${STRATUM_GATEWAY_ENABLED:false}
      upstream: ${STRATUM_GATEWAY_UPSTREAM:http://127.0.0.1:8080}
      gray-enabled: ${STRATUM_GATEWAY_GRAY_ENABLED:false}
      gray-upstream: ${STRATUM_GATEWAY_GRAY_UPSTREAM:}
      gray-header: ${STRATUM_GATEWAY_GRAY_HEADER:X-Stratum-Release}
      gray-value: ${STRATUM_GATEWAY_GRAY_VALUE:gray}
      host: ${STRATUM_GATEWAY_HOST:}
    proxy:
      connect-timeout: ${STRATUM_GATEWAY_CONNECT_TIMEOUT:2s}
      response-timeout: ${STRATUM_GATEWAY_RESPONSE_TIMEOUT:5s}
      maximum-connections: ${STRATUM_GATEWAY_MAXIMUM_CONNECTIONS:128}
      maximum-pending: ${STRATUM_GATEWAY_MAXIMUM_PENDING:256}
      acquire-timeout: ${STRATUM_GATEWAY_ACQUIRE_TIMEOUT:1s}
    protection:
      maximum-body-bytes: ${STRATUM_GATEWAY_MAXIMUM_BODY_BYTES:1048576}
      maximum-header-bytes: ${STRATUM_GATEWAY_MAXIMUM_HEADER_BYTES:16384}
      maximum-header-count: ${STRATUM_GATEWAY_MAXIMUM_HEADER_COUNT:100}
      maximum-buffered-requests: ${STRATUM_GATEWAY_MAXIMUM_BUFFERED_REQUESTS:32}
      body-timeout: ${STRATUM_GATEWAY_BODY_TIMEOUT:5s}
    management:
      allowed-cidrs: ${STRATUM_GATEWAY_MANAGEMENT_ALLOWED_CIDRS:127.0.0.0/8,::1/128}
    rate-limit:
      replenish-rate: ${STRATUM_GATEWAY_REPLENISH_RATE:20}
      burst-capacity: ${STRATUM_GATEWAY_BURST_CAPACITY:40}
      maximum-clients: ${STRATUM_GATEWAY_MAXIMUM_CLIENTS:4096}
      namespace: ${STRATUM_GATEWAY_RATE_NAMESPACE:stratum-gateway}
      command-timeout: ${STRATUM_GATEWAY_RATE_TIMEOUT:500ms}

logging:
  structured:
    format:
      console: com.patrick.stratum.gateway.logging.GatewayStructuredLogFormatter
