plugins {
    id 'base'
    id 'org.springframework.boot' version '4.0.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    lombokVersion = '1.18.44'
    springBootVersion = '4.0.5'
    springCloudVersion = '2025.1.4'
    easyQueryVersion = '3.3.1'
    springdocVersion = '3.0.3'
    knife4jUiVersion = '4.5.0'
    shedLockVersion = '7.10.1'
}

allprojects {
    group = 'com.patrick.stratum'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencies {
        if (project.name !in ['stratum-domain', 'stratum-common']) {
            implementation enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        }
        if (project.name == 'stratum-gateway') {
            implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
        }
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testImplementation enforcedPlatform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        constraints {
            implementation "net.javacrumbs.shedlock:shedlock-spring:${shedLockVersion}"
            implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedLockVersion}"
            implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
            implementation "com.github.xiaoymin:knife4j-openapi3-ui:${knife4jUiVersion}"
            implementation "com.easy-query:sql-springboot4-starter:${easyQueryVersion}"
            implementation "com.easy-query:sql-mysql:${easyQueryVersion}"
            annotationProcessor "com.easy-query:sql-processor:${easyQueryVersion}"
            implementation 'org.slf4j:slf4j-api:2.0.17'
            implementation 'org.apache.commons:commons-lang3:3.18.0'
            implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
